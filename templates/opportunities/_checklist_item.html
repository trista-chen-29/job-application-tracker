<li id="check-{{ item.pk }}">
  <form method="post" action="{% url 'checklist_toggle' opportunity.pk item.pk %}" hx-post="{% url 'checklist_toggle' opportunity.pk item.pk %}" hx-target="#check-{{ item.pk }}" hx-swap="outerHTML">
    {% csrf_token %}
    <button class="btn ghost" type="submit">{% if item.completed %}Done{% else %}Todo{% endif %}</button>
  </form>
  <span {% if item.completed %}style="text-decoration:line-through"{% endif %}>{{ item.label }}</span>
</li>
